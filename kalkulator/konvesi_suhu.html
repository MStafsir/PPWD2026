<!DOCTYPE html>
<html>
<head>
    <title>Tugas 1 - Konversi Suhu</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; background: #f0f8ff; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 10px; margin: 5px; font-size: 16px; width: 80%; box-sizing: border-box; }
        button { padding: 10px 15px; margin: 5px; font-size: 16px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
        .hasil { font-size: 20px; font-weight: bold; color: #2c3e50; margin-top: 20px; text-align: left; background: #eaf2f8; padding: 15px; border-radius: 6px;}
    </style>
</head>
<body>
    <div class="container">
        <h2> Konversi Suhu</h2>
        
        <input type="number" id="inputCelcius" placeholder="Masukkan suhu dalam Celcius">
        <br><br>
        <button onclick="konversiSuhu()">Konversi</button>
        
        <div class="hasil" id="hasilTarget">Hasil konversi akan tampil di sini...</div>
    </div>

    <script>
        function konversiSuhu() {
            // Mengambil nilai input
            let celcius = parseFloat(document.getElementById('inputCelcius').value);

            // Validasi input harus angka dan tidak boleh kosong
            if (isNaN(celcius)) {
                document.getElementById('hasilTarget').innerHTML = "Peringatan: Input harus berupa angka!";
                return;
            }

            // Rumus perhitungan suhu
            let fahrenheit = (celcius * 9/5) + 32;
            let kelvin = celcius + 273.15;

            // Menampilkan hasil
            document.getElementById('hasilTarget').innerHTML = 
                "Fahrenheit = " + fahrenheit + " &deg;F<br>" + 
                "Kelvin = " + kelvin + " K";
        }
    </script>
</body>
</html>
